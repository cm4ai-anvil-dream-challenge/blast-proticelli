<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 412" role="img" aria-label="Steps 2 to 5 repeat until the model is ready to submit" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8c8c86"/>
    </marker>
  </defs>
  <rect width="760" height="412" fill="#ffffff"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#1f1f1d">Steps 2 to 5 repeat until the model is ready to submit</text>

  <rect x="20" y="52" width="716" height="236" rx="8" fill="#f3f3f1" stroke="#c9c9c3"/>
  <text x="36" y="76" font-weight="600" fill="#5c5c58">Phase A: train a model (notebook)</text>
  <rect x="20" y="304" width="716" height="88" rx="8" fill="#f3f3f1" stroke="#c9c9c3"/>
  <text x="36" y="328" font-weight="600" fill="#5c5c58">Phase B: submit (command line)</text>
  <text x="36" y="360" font-size="11.5" fill="#5c5c58">Weights zip to bucket; WDL test run on 1 or 2 cells</text>

  <g fill="none" stroke="#8c8c86" stroke-width="1.25">
    <path d="M156 116H176" marker-end="url(#arrow)"/>
    <path d="M292 116H312" marker-end="url(#arrow)"/>
    <path d="M428 116H448" marker-end="url(#arrow)"/>
    <path d="M564 116H584" marker-end="url(#arrow)"/>
    <path d="M642 140V200" marker-end="url(#arrow)"/>
    <path d="M578 236H234V140" marker-end="url(#arrow)"/>
    <path d="M370 236V140" marker-end="url(#arrow)"/>
    <path d="M642 272V332" marker-end="url(#arrow)"/>
  </g>

  <g fill="#ffffff" stroke="#8c8c86" stroke-width="1.25">
    <rect x="40" y="92" width="116" height="48" rx="8"/>
    <rect x="176" y="92" width="116" height="48" rx="8"/>
    <rect x="312" y="92" width="116" height="48" rx="8"/>
    <rect x="448" y="92" width="116" height="48" rx="8"/>
    <rect x="584" y="92" width="116" height="48" rx="8"/>
    <polygon points="578,236 642,200 706,236 642,272"/>
  </g>
  <g fill="#1f1f1d" text-anchor="middle">
    <text x="98" y="120">1. Set up</text>
    <text x="234" y="120">2. Format data</text>
    <text x="370" y="120">3. Train</text>
    <text x="506" y="120">4. Predict</text>
    <text x="642" y="120">5. Evaluate</text>
    <text x="642" y="240">Good enough?</text>
  </g>

  <rect x="542" y="332" width="176" height="48" rx="8" fill="#e3ecf7" stroke="#2f6db5" stroke-width="2"/>
  <text x="630" y="360" text-anchor="middle" font-weight="600" fill="#1f1f1d">6. Prepare submission</text>

  <g font-size="11.5" fill="#5c5c58">
    <text x="568" y="228" text-anchor="end">no</text>
    <text x="474" y="228" text-anchor="middle">change the model</text>
    <text x="302" y="228" text-anchor="middle">add more data</text>
    <text x="652" y="296">yes</text>
  </g>
</svg>
